# ──────────────────────────────────────────────────────────────
#  Smart Attendance System – Docker Compose
# ──────────────────────────────────────────────────────────────
#  Usage:
#    docker compose up --build        (build + start)
#    docker compose up -d             (detached)
#    docker compose down              (stop + remove)
#
#  Environment variables are read from .env in the project root.
# ──────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be available at BUILD time
        # because Next.js inlines them into the client bundle
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Runtime server-side variables
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - QR_HMAC_SECRET=${QR_HMAC_SECRET}
      - TEACHER_SIGNUP_ACCESS_KEY=${TEACHER_SIGNUP_ACCESS_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
